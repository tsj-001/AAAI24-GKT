[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gkt-pytorch"
version = "0.1.0"
description = "Boosting Residual Networks with Group Knowledge (GKT), PyTorch implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GKT authors" }]
dependencies = [
    "einops>=0.6",
    "numpy>=1.21",
    "PyYAML>=5.4",
    "Pillow>=9.0",
    "timm>=0.9.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0,<3",
    "torchvision>=0.15,<1",
    "torchaudio>=2.0,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gkt*"]
