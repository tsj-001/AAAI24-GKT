# data
workers: 4

# info
num_classes: 100
image_size: 32
topk: [1, 5]
start_epoch: 0
epochs: 100
#epochs: 200
print_freq: 100
batch_size: 128

# optimizer
optimizer: adamw
momentum: 0.9
weight_decay: 0.05
nesterov: True

# lr
lr: 0.001
lr_scheduler: warmup_cosine

# model
model: swin
depth: 12
widen_factor: 10
max_width: 1.0
min_width: 0.8
num_subnet: 3
resos: [32]
reset_parameters: True
resume: ''
log_dir: logs/wideresnet28-10_randwidth/
test_only: False
pretrained: ''