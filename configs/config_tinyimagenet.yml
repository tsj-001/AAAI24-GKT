# data
workers: 4

# info
num_classes: 200
image_size: 32
topk: [1, 5]
start_epoch: 0
epochs: 200
print_freq: 100
batch_size: 128

# optimizer
optimizer: sgd
momentum: 0.9
weight_decay: 0.0001
nesterov: True

# lr
lr: 0.2
lr_scheduler: multistep
lr_steps: [100, 150]
lr_gamma: 0.1

# model
model: wideresnet
depth: 28
widen_factor: 10
max_width: 1.0
min_width: 0.8
num_subnet: 3
resos: [32, 28, 24]
reset_parameters: True
resume: ''
log_dir: logs/wideresnet28-10_randwidth/
test_only: False
pretrained: ''