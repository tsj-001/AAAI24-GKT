# data
workers: 4

# info
num_classes: 200
image_size: 64
topk: [1, 5]
start_epoch: 0
#epochs: 100
epochs: 200
print_freq: 100
batch_size: 128

# optimizer
optimizer: adamw
momentum: 0.9
weight_decay: 0.05
nesterov: True

# lr
lr: 0.003
#lr: 0.0015
lr_scheduler: warmup_cosine

# model
model: vit
depth: 9
widen_factor: 10
max_width: 1.0
min_width: 0.8
num_subnet: 3
#resos: [32, 28, 24]
resos: [64]
reset_parameters: True
resume: ''
log_dir: logs/wideresnet28-10_randwidth/
test_only: False
pretrained: ''